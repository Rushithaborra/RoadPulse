services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env          # copy .env.example to .env first
    volumes:
      - roadpulse-data:/app/data   # a named volume: starts with the image's data (including area.graphml), stays writable, survives restarts
    restart: unless-stopped
volumes:
  roadpulse-data:
