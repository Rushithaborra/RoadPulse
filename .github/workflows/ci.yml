name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t roadpulse:ci .
      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name rp roadpulse:ci
          for i in $(seq 1 20); do curl -sf localhost:8000/api/health && exit 0; sleep 1; done
          docker logs rp; exit 1
