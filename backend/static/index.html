<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RoadPulse — know before you go</title>
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232563eb'/%3E%3Crect x='14' y='30' width='36' height='5' rx='2.5' fill='white'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232563eb'/%3E%3Crect x='14' y='30' width='36' height='5' rx='2.5' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/static/rp.css">
  <style>
    .topbar { position: fixed; z-index: 550; top: 12px; left: 12px; right: 12px; display: flex; gap: 10px; align-items: flex-start; pointer-events: none; }
    .topbar > * { pointer-events: auto; } .topbar .pill { flex: 1; min-width: 0; }
    .pill .t { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .pill .sub { display: block; font-size: 13px; line-height: 1.3; }
    .side { display: flex; flex-direction: column; gap: 10px; }
    .fab { position: fixed; z-index: 520; left: 12px; bottom: calc(var(--sheet-h) + 14px); height: 48px; padding: 0 18px; border-radius: 999px; background: var(--brand); color: #fff; font-weight: 700; box-shadow: var(--shadow); }
    @media (min-width: 900px) { .topbar { right: auto; width: 400px; left: 16px; } .side { position: fixed; right: 12px; top: 12px; bottom: auto; } .fab { bottom: 28px; left: auto; right: 12px; } }
  </style>
</head>
<body>
  <div id="map" aria-label="Road map"></div>
  <div class="topbar">
    <button id="pill" class="pill"><span style="color:var(--brand)" id="pill-ic"></span>
      <span class="grow"><b class="t" id="pill-t">Where to?</b><span class="sub" id="pill-s">Tap your start and your destination on the map</span></span>
      <span id="pill-x" class="link hidden">Clear</span></button>
  </div>
  <div class="side">
    <button id="btn-locate" class="round" aria-label="Use my location" title="Use my location"></button>
    <button id="btn-style" class="round" aria-label="Switch between map and satellite" title="Map or satellite"></button>
  </div>
  <div id="offline" class="chip warnc offline hidden">Offline: showing the last information</div>
  <button id="btn-report" class="fab"></button>
  <div class="legend" aria-label="What the colours mean"><span><i style="background:#d9a400"></i>Minor</span><span><i style="background:#ef7d00"></i>Slow</span><span><i style="background:#d92d20"></i>Very slow</span><span><i style="background:#7a1fa2"></i>Blocked</span></div>

  <section id="sheet" class="sheet" aria-label="Road problems">
    <div id="grab" class="grab" role="button" tabindex="0" aria-label="Make the card bigger or smaller"></div>
    <div id="body" class="sheet-body"></div>
  </section>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="/static/vendor/leaflet/leaflet.js"></script>
  <script src="/static/rp.js"></script>
  <script src="/static/commuter.js"></script>
</body>
</html>
