<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoadPulse — roadside board (simulated)</title>
  <style>
    @font-face { font-family: "Overpass"; font-weight: 800; font-display: swap; src: url("/static/vendor/fonts/overpass-latin-800-normal.woff2") format("woff2"); }
    @font-face { font-family: "Overpass"; font-weight: 600; font-display: swap; src: url("/static/vendor/fonts/overpass-latin-600-normal.woff2") format("woff2"); }
    :root { --amber: #ffb21a; --red: #ff3b2f; --green: #39e27a; --pitch: 5px; --dot: 1.75px; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: "Overpass", system-ui, sans-serif; color: #c9d1da; display: flex; flex-direction: column;
      background: radial-gradient(120% 80% at 50% 0%, #2b3440 0%, #171c22 60%, #101317 100%); }
    a { color: inherit; } .hidden { display: none !important; }
    :focus-visible { outline: 3px solid #8fb4ff; outline-offset: 3px; }
    .top { display: flex; align-items: center; gap: 16px; padding: 14px 22px; font-weight: 600; font-size: 15px; }
    .top .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top .back { text-decoration: none; padding: 6px 10px; border-radius: 8px; background: #ffffff12; }
    .top time { font-variant-numeric: tabular-nums; color: #8b97a5; }
    main { flex: 1; display: grid; place-items: center; padding: 10px 22px 30px; }

    /* the sign: a steel housing, a black LED matrix inside */
    .sign { width: min(1100px, 100%); }
    .housing { padding: 16px; border-radius: 8px; background: linear-gradient(180deg, #59636f, #3b434d 40%, #2f363e); box-shadow: 0 24px 60px #0009, inset 0 1px 0 #ffffff30; position: relative; }
    .housing::before, .housing::after { content: ""; position: absolute; top: 6px; width: 6px; height: 6px; border-radius: 50%; background: #20262d; }
    .housing::before { left: 6px; } .housing::after { right: 6px; }
    .panel { position: relative; min-height: clamp(200px, 34vw, 360px); border-radius: 3px; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: clamp(16px, 3vw, 40px);
      padding: clamp(18px, 3vw, 34px) clamp(18px, 3.4vw, 40px);
      background: radial-gradient(circle, #1d1a14 var(--dot), transparent calc(var(--dot) + .4px)) 0 0 / var(--pitch) var(--pitch), #050505;
      box-shadow: inset 0 0 0 2px #000, inset 0 0 40px #000; }
    .panel.text-only { grid-template-columns: 1fr; text-align: center; }
    /* lit LEDs: the glyphs are cut into dots by a mask, the wrapper adds the glow */
    .led { -webkit-mask: radial-gradient(circle, #000 var(--dot), transparent calc(var(--dot) + .45px)) 0 0 / var(--pitch) var(--pitch);
           mask: radial-gradient(circle, #000 var(--dot), transparent calc(var(--dot) + .45px)) 0 0 / var(--pitch) var(--pitch); }
    .glow-a { filter: drop-shadow(0 0 5px #ffb21a99); } .glow-r { filter: drop-shadow(0 0 6px #ff3b2faa); } .glow-g { filter: drop-shadow(0 0 5px #39e27a99); }
    .pict { width: clamp(110px, 17vw, 190px); aspect-ratio: 1; }
    .pict svg { width: 100%; height: 100%; display: block; }
    .msg { display: grid; gap: clamp(8px, 1.4vw, 16px); min-width: 0; }
    .msg div { font-weight: 800; text-transform: uppercase; line-height: 1.02; letter-spacing: .04em; text-wrap: balance; overflow-wrap: break-word; hyphens: none; }
    .l1 { color: var(--amber); font-size: clamp(22px, 3.6vw, 44px); }
    .l2 { color: var(--amber); font-size: clamp(30px, 5.6vw, 72px); }
    .l3 { color: var(--green); font-size: clamp(22px, 3.6vw, 44px); }
    .big { font-size: clamp(44px, 9vw, 120px) !important; }
    .pager { position: absolute; right: 14px; bottom: 10px; display: flex; gap: 6px; }
    .pager i { width: 8px; height: 8px; border-radius: 50%; background: #2a261c; } .pager i.on { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
    .blink { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: .15; } }
    .mount { display: flex; justify-content: space-around; width: 60%; margin: 0 auto; }
    .mount i { width: 14px; height: 46px; background: linear-gradient(90deg, #39414a, #5a646f, #39414a); }
    .plate { margin: 14px auto 0; width: max-content; max-width: 100%; padding: 6px 12px; border-radius: 6px; border: 1px dashed #6b7684; color: #9aa6b4; font-size: 13px; font-weight: 600; }

    /* list of boards */
    .list { width: min(1100px, 100%); display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); align-self: start; }
    .list a { display: block; text-decoration: none; padding: 12px; border-radius: 12px; background: #ffffff0d; border: 1px solid #ffffff14; }
    .list a:hover { background: #ffffff17; }
    .list .name { font-weight: 600; margin: 10px 2px 0; display: flex; justify-content: space-between; gap: 10px; }
    .list .name span { color: #8b97a5; flex: none; }
    .list .housing { padding: 8px; } .list .panel { min-height: 120px; --pitch: 3px; --dot: 1.05px; padding: 14px; gap: 14px; }
    .list .pict { width: 72px; } .list .l1, .list .l3 { font-size: 15px; } .list .l2 { font-size: 21px; } .list .big { font-size: 34px !important; }
    .list .pager { display: none; }
    h1 { font-size: 22px; margin: 0 0 4px; color: #e8edf2; } .lede { margin: 0 0 18px; color: #8b97a5; }
    footer { padding: 10px 22px 16px; color: #6f7b88; font-size: 13px; text-align: center; }
    @media (max-width: 600px) { :root { --pitch: 4px; --dot: 1.4px; } .panel { grid-template-columns: 1fr; justify-items: start; gap: 14px; } .pict { width: 84px; }
      .l1, .l3 { font-size: 20px; } .l2 { font-size: 28px; } .big { font-size: 44px !important; } }
    @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
  </style>
</head>
<body>
  <div class="top"><a class="back hidden" id="back" href="/board">‹ All boards</a><span class="grow" id="name">Roadside boards</span><time id="clock"></time></div>
  <main id="main"></main>
  <footer>A real board needs hardware, power and a data link. This page shows what it would display, from the same live data as the app.</footer>
  <script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const id = new URLSearchParams(location.search).get("id");
  const KIND = { Accident: "ACCIDENT", "Road blocked": "ROAD BLOCKED", Waterlogging: "WATER ON ROAD", Construction: "ROAD WORKS", "Unexplained slowdown": "SLOW TRAFFIC" };
  const kindOf = (t) => String(t).split(" · ")[0];
  const label = (t) => KIND[kindOf(t)] || kindOf(t).toUpperCase();
  // the short forms painted on Indian road signs, so long OSM names fit the matrix
  const short = (n) => String(n).replace(/\bjunction\b/gi, "Jn").replace(/\broad\b/gi, "Rd").replace(/\blane\b/gi, "Ln")
    .replace(/\bmain\b/gi, "Main").replace(/\s*-\s*/g, " – ").replace(/\s+,/g, ",").replace(/\s{2,}/g, " ").trim();
  // pictograms: a red warning ring with an amber symbol inside
  const GLYPH = {
    Waterlogging: '<path d="M30 60q6-6 12 0t12 0 12 0 12 0M30 72q6-6 12 0t12 0 12 0 12 0" fill="none" stroke="#ffb21a" stroke-width="5" stroke-linecap="round"/>',
    Construction: '<path d="M50 34 62 74H38z" fill="#ffb21a"/><rect x="32" y="74" width="36" height="6" fill="#ffb21a"/>',
    Accident: '<rect x="44" y="36" width="12" height="28" rx="3" fill="#ffb21a"/><circle cx="50" cy="74" r="6" fill="#ffb21a"/>',
  };
  function pict(kind, sev) {
    if (sev === "Closed" && kind !== "Construction")
      return '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="40" fill="none" stroke="#ff3b2f" stroke-width="12"/><rect x="24" y="42" width="52" height="16" fill="#ffb21a"/></svg>';
    return `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 8 94 88H6z" fill="none" stroke="#ff3b2f" stroke-width="10" stroke-linejoin="round"/>${GLYPH[kind] || GLYPH.Accident}</svg>`;
  }
  // One page per warning, like a real VMS cycles its messages.
  function pages(b) {
    if (!b.lines.length) return [{ clear: true }];
    const use = b.alternatives.filter((a) => a !== "side road");
    return b.lines.map((l) => ({ kind: kindOf(l.title), sev: l.severity, l1: `${label(l.title)} ${l.metres} m ahead`, l2: `Avoid ${short(l.road)}`,
      l3: use.length ? `Use ${short(use[0])}` : b.alternatives.length ? "Use side road" : "" }));
  }
  function signHtml(p, n, k) {
    if (p.down) return `<div class="housing"><div class="panel text-only"><div class="msg"><div class="glow-a"><div class="l2 big led blink">No data link</div></div>
      <div class="glow-a"><div class="l1 led">Follow signs, drive carefully</div></div></div></div></div>`;
    if (p.clear) return `<div class="housing"><div class="panel text-only"><div class="msg"><div class="glow-g"><div class="l3 big led">Road clear</div></div>
      <div class="glow-a"><div class="l1 led">Drive safely</div></div></div></div></div>`;
    return `<div class="housing"><div class="panel"><div class="pict glow-r"><div class="led blink">${pict(p.kind, p.sev)}</div></div>
      <div class="msg"><div class="glow-a"><div class="l1 led">${esc(p.l1)}</div></div><div class="glow-a"><div class="l2 led">${esc(p.l2)}</div></div>
      ${p.l3 ? `<div class="glow-g"><div class="l3 led">${esc(p.l3)}</div></div>` : ""}</div>
      ${n > 1 ? `<div class="pager">${Array.from({ length: n }, (_, j) => `<i class="${j === k ? "on" : ""}"></i>`).join("")}</div>` : ""}</div></div>`;
  }
  let board = null, page = 0, down = false;
  function paint() {
    if (!id) return;
    if (down || !board) { $("main").innerHTML = `<div class="sign">${signHtml({ down: true })}<div class="mount"><i></i><i></i></div></div>`; return; }
    const ps = pages(board), p = ps[page % ps.length];
    // the plain-text version of what the LEDs say, for screen readers
    const said = p.clear ? "Road clear. Drive safely." : `${p.l1}. ${p.l2}. ${p.l3 || ""}`;
    $("main").innerHTML = `<div class="sign" role="img" aria-label="${esc(said)}">${signHtml(p, ps.length, page % ps.length)}<div class="mount"><i></i><i></i></div>
      <div class="plate">Simulated display, from live RoadPulse data</div></div>`;
  }
  async function tick() {
    $("clock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    try {
      if (!id) {
        const r = await (await fetch("/api/boards")).json();
        $("main").innerHTML = `<div class="list" style="grid-column:1"><div style="grid-column:1/-1"><h1>Roadside boards</h1><p class="lede">What each junction sign would show right now. Open one full screen.</p></div>
          ${r.boards.map((b) => { const p = pages(b)[0]; return `<a href="/board?id=${encodeURIComponent(b.id)}"><div class="sign">${signHtml(p, 1, 0)}</div>
            <div class="name"><b>${esc(b.name)}</b><span>${b.lines.length ? `${b.lines.length} warning${b.lines.length > 1 ? "s" : ""}` : "Clear"}</span></div></a>`; }).join("")}</div>`;
        return;
      }
      const res = await fetch(`/api/boards/${encodeURIComponent(id)}`);
      if (!res.ok) { board = null; $("main").innerHTML = `<p>No board called ${esc(id)}. <a href="/board">See all boards</a></p>`; return; }
      board = await res.json(); down = false; $("name").textContent = board.name;
    } catch (e) { down = true; }
    paint();
  }
  if (id) { $("back").classList.remove("hidden"); setInterval(() => { page += 1; paint(); }, 4000); }
  tick(); setInterval(tick, 3000);
  </script>
</body>
</html>
