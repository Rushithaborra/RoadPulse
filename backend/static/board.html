<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoadPulse — roadside board (simulated)</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #05080d; color: #ffb000; font-family: "Courier New", ui-monospace, monospace; display: flex; flex-direction: column; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 14px 22px; border-bottom: 2px solid #3a2a00; color: #c58a00; font-size: 15px; gap: 12px; flex-wrap: wrap; }
    .sim { border: 1px dashed #c58a00; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    main { flex: 1; padding: 28px 22px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
    .line { border: 3px solid #ff3b30; padding: 18px 22px; border-radius: 6px; }
    .line .big { font-size: clamp(28px, 6vw, 56px); font-weight: 700; color: #ff3b30; line-height: 1.1; }
    .line .small { font-size: clamp(18px, 3vw, 28px); margin-top: 8px; color: #ffb000; }
    .alt { font-size: clamp(18px, 3vw, 28px); color: #7CFC9A; }
    .clear { font-size: clamp(40px, 9vw, 96px); font-weight: 700; color: #34c759; text-align: center; }
    .clear small { display: block; font-size: clamp(16px, 2.5vw, 24px); color: #7a8a7a; font-weight: 400; margin-top: 10px; }
    ul { list-style: none; padding: 0; margin: 0; } li { margin: 12px 0; } a { color: #ffb000; font-size: 22px; }
    footer { padding: 10px 22px; color: #6b5200; font-size: 12px; }
  </style>
</head>
<body>
  <header><span id="name">Roadside board</span><span class="sim">SIMULATED DISPLAY</span><span id="clock"></span></header>
  <main id="main"></main>
  <footer>A real board needs hardware, power and a data link. This page shows what it would display, from the same live data as the app.</footer>
  <script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const id = new URLSearchParams(location.search).get("id");
  const KIND = { Accident: "ACCIDENT", "Road blocked": "ROAD BLOCKED", Waterlogging: "WATER ON ROAD", Construction: "ROAD WORKS", "Unexplained slowdown": "SLOW TRAFFIC" };
  function label(t) { const k = String(t).split(" · ")[0]; return KIND[k] || k.toUpperCase(); }
  async function tick() {
    $("clock").textContent = new Date().toLocaleTimeString();
    try {
      if (!id) {
        const r = await (await fetch("/api/boards")).json();
        $("main").innerHTML = `<ul>${r.boards.map((b) => `<li><a href="/board?id=${esc(b.id)}">${esc(b.id)} · ${esc(b.name)}</a> ${b.lines.length ? "· WARNING" : ""}</li>`).join("")}</ul>`;
        return;
      }
      const res = await fetch(`/api/boards/${encodeURIComponent(id)}`);
      if (!res.ok) { $("main").innerHTML = `<div class="clear">NO SUCH BOARD</div>`; return; }
      const b = await res.json();
      $("name").textContent = b.name;
      if (!b.lines.length) { $("main").innerHTML = `<div class="clear">ROAD CLEAR<small>Drive safely</small></div>`; return; }
      $("main").innerHTML = b.lines.map((l) => `<div class="line"><div class="big">AVOID ${esc(l.road.toUpperCase())}</div>
        <div class="small">${esc(label(l.title))} about ${l.metres} m ahead</div></div>`).join("") +
        (b.alternatives.length ? `<div class="alt">USE: ${esc(b.alternatives.join(" · ").toUpperCase())}</div>` : "");
    } catch (e) { $("main").innerHTML = `<div class="line"><div class="big">NO DATA LINK</div><div class="small">Follow the signs and drive carefully</div></div>`; }
  }
  tick(); setInterval(tick, 3000);
  </script>
</body>
</html>
