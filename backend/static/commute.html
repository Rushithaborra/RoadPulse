<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RoadPulse — my alerts</title>
  <meta name="theme-color" content="#0e3a72">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230e3a72'/%3E%3Crect x='14' y='30' width='36' height='5' rx='2.5' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/static/rp.css">
  <style>
    .topbar { position: fixed; z-index: 550; top: 12px; left: 12px; right: 12px; display: flex; gap: 10px; align-items: center; pointer-events: none; }
    .topbar > * { pointer-events: auto; } .titlebar { flex: 1; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); font-weight: 700; min-width: 0; }
    @media (min-width: 900px) { .topbar { right: auto; width: 400px; left: 16px; } .side { position: fixed; right: 12px; top: 12px; bottom: auto; } }
    .alert { border-left: 6px solid var(--brand); } .alert.uturn, .alert.no_alternative { border-left-color: var(--bad); } .alert.clear { border-left-color: var(--ok); } .alert.pre_trip { border-left-color: var(--medium); }
    .legend { display: none; }
  </style>
</head>
<body>
  <div id="map" aria-label="Map"></div>
  <div class="topbar"><div class="titlebar"><a href="/" class="link" aria-label="Back to the map">‹</a><span style="color:var(--brand)" id="t-ic"></span><span id="t-t">My alerts</span></div></div>
  <div class="side"><button id="btn-style" class="round" aria-label="Switch between map and satellite"></button></div>
  <section id="sheet" class="sheet" aria-label="My alerts">
    <div id="grab" class="grab" role="button" tabindex="0" aria-label="Make the card bigger or smaller"></div>
    <div id="body" class="sheet-body"></div>
  </section>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script src="/static/vendor/leaflet/leaflet.js"></script>
  <script src="/static/rp.js"></script>
  <script src="/static/commute.js"></script>
</body>
</html>
